; Copy to config.ini, or set BLOG_CONFIG to a private text file outside public/
; Relative storage paths are resolved from this file's directory
; Sections, keys and comments may be reordered; keep each key unique
; Panel changes update only admin values and preserve comments and ordering
; BLOG_* environment variables override matching core settings when provided

[site]
name = "wri"
description = "a little place to write on the internet"
base_url = "http://localhost:8080"
registration = true
debug = false

[admin]
user_id = ""
initialized = false
allow_signups = true
homepage_blog_id = ""

[storage]
database = "storage/blog.sqlite"
sessions = "storage/sessions"

[limits]
request_bytes = 262144
markdown_bytes = 131072
css_bytes = 65536
posts_per_blog = 10000

[sessions]
lifetime_seconds = 86400

[passwords]
argon_memory_kib = 65536
argon_time = 3
bcrypt_cost = 12

; Extensions read their own sections; the core does not validate extension keys
[mermaid]
; Empty uses the bundled binary; explicit paths are relative to this config file
binary = ""
